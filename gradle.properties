# Versions are declared once, here.
quarkusVersion=4.0.0.Beta1
quinoaVersion=2.9.2
# Gluonify SDK (Crystallon client). The version is the platform's (the "Code" tab of Crystallon's editor shows the one of your installation).
gluonifySdkVersion=0.6.0
# Maven repository of the Gluonify SDK, served by gluonify-sea (public read). To use a mirror or a local copy: ./gradlew test -Pgluonify.sea.maven.url=file:///path/to/repository
gluonify.sea.maven.url=https://images.gluonify.io/maven

# The service is a NATIVE executable only (rule R-NATIF): never set quarkus.native.enabled=false.
# Gluonify's builder (gluonify-bup) runs: ./gradlew build -Dquarkus.native.enabled=true ... (see README, "Build").
# -march=compatibility : the executable runs on any x86-64 / arm64 CPU (otherwise GraalVM 25 targets x86-64-v3, AVX2).
# SystemTicker : Netty must not freeze the build machine's clock at compile time, otherwise its timeouts expire immediately elsewhere.
quarkus.native.additional-build-args=-march=compatibility,--initialize-at-run-time=io.netty.util.concurrent.SystemTicker

org.gradle.jvmargs=-Xmx2g
